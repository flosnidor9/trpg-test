        <h1>같은 모험을<br><em>더 편안하게.</em></h1>
        <p class="lede">플레이 성향을 미리 살펴보고,<br>세션에 참여하는 모두와 이야기해봐요.</p>
        <nav class="landing-actions" aria-label="시작 메뉴">
          <a class="landing-action landing-action-primary" href="test.html"><span class="action-number">1</span><span class="action-label">테스트 시작</span><span class="action-arrow" aria-hidden="true">→</span></a>

      <div class="hero-art" aria-hidden="true">

                <linearGradient id="die-left" x1="14" y1="39" x2="63" y2="111" gradientUnits="userSpaceOnUse"><stop stop-color="#8c6ce8"/><stop offset="1" stop-color="#6343bf"/></linearGradient>
                <linearGradient id="die-right" x1="60" y1="58" x2="106" y2="101" gradientUnits="userSpaceOnUse"><stop stop-color="#6b49cf"/><stop offset="1" stop-color="#40247e"/></linearGradient>

              <g transform="rotate(45 60 60)"><g clip-path="url(#rounded-die)">
              <path d="M60 10 106 36 60 63 14 36Z" fill="url(#die-top)"/>
              <path d="M14 36 60 63 60 115 14 88Z" fill="url(#die-left)"/>
              <path d="M60 63 106 36 106 88 60 115Z" fill="url(#die-right)"/>

              <g fill="#fff" transform="matrix(.46 .27 0 .52 14 36)"><circle cx="25" cy="25" r="8"/><circle cx="75" cy="25" r="8"/><circle cx="25" cy="75" r="8"/><circle cx="75" cy="75" r="8"/></g>
              <g fill="#eee7ff" transform="matrix(.46 -.27 0 .52 60 63)"><circle cx="25" cy="22" r="8"/><circle cx="75" cy="22" r="8"/><circle cx="25" cy="50" r="8"/><circle cx="75" cy="50" r="8"/><circle cx="25" cy="78" r="8"/><circle cx="75" cy="78" r="8"/></g>

          </div>

            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 55c0-17 8-27 19-27s19 10 19 27H13Z"/><circle cx="32" cy="22" r="10"/></svg>
          </span>
          <span class="orbit-person person-two" style="--phase:2.0943951024">

          </span>
          <span class="orbit-person person-three" style="--phase:4.1887902048">

          </span>

          <span class="orbit-spark spark-two">✧</span>
